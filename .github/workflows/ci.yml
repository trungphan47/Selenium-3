name: Sele3 CI/CD

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      suite:
        description: TestNG suite file
        required: true
        default: testng.xml
        type: string

      browser:
        description: Browser
        required: true
        default: chrome
        type: choice
        options:
          - chrome
          - firefox
          - edge

      headless:
        description: Headless mode
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

      report:
        description: Report provider
        required: true
        default: allure
        type: choice
        options:
          - allure
          - extent
          - console

      timeout:
        description: Timeout in milliseconds
        required: true
        default: '60000'
        type: string

      pollingInterval:
        description: Polling interval in milliseconds
        required: true
        default: '500'
        type: string

      publishPackage:
        description: Publish framework package
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: CI - Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify environment
        run: |
          java -version
          mvn -version

      - name: Run tests
        run: >
          mvn clean test
          -Dsurefire.suiteXmlFiles=${{ github.event_name == 'workflow_dispatch' && inputs.suite || 'testng.xml' }}
          -Dbrowser=${{ github.event_name == 'workflow_dispatch' && inputs.browser || 'chrome' }}
          -Dheadless=${{ github.event_name == 'workflow_dispatch' && inputs.headless || 'true' }}
          -Dreport.provider=${{ github.event_name == 'workflow_dispatch' && inputs.report || 'allure' }}
          -Dtimeout=${{ github.event_name == 'workflow_dispatch' && inputs.timeout || '60000' }}
          -DpollingInterval=${{ github.event_name == 'workflow_dispatch' && inputs.pollingInterval || '500' }}

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/reports/allure-reports
          if-no-files-found: ignore

  publish:
    name: CD - Publish Framework Package
    needs: test

    if: >
      github.event_name == 'workflow_dispatch' &&
      inputs.publishPackage == true

    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Publish package to GitHub Packages
        run: >
          mvn deploy
          -DskipTests
          -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/${{ github.repository }}
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          